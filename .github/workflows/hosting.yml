name: Hosting build and Mac Studio release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="ci-$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main && "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Run from main with a vMAJOR.MINOR.PATCH version.' >&2; exit 1; }
            version="$RELEASE_VERSION"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test Hosting in Linux and build the Mac Studio image
        run: |
          docker build --platform linux/arm64 --target test .
          docker build --platform linux/arm64 --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" -t "csweet-hosting:$VERSION" .
          bash deploy/test-image.sh "csweet-hosting:$VERSION"
      - name: Package the verified image and deployment files
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir bundle
          docker save "csweet-hosting:$VERSION" | gzip -1 > bundle/hosting-image.tar.gz
          cp compose.hosting.yml deploy/deploy.sh bundle/
          cd bundle
          printf '%s\n' "$VERSION" > version
          printf '%s\n' "$GITHUB_SHA" > revision
          sha256sum hosting-image.tar.gz compose.hosting.yml deploy.sh version revision > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        if: github.event_name == 'workflow_dispatch'
        with:
          name: hosting-linux-arm64
          path: bundle/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          merge-multiple: true
          path: bundle
      - name: Publish versioned GitHub Release
        working-directory: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          sha256sum -c SHA256SUMS
          test "$(cat revision)" = "$GITHUB_SHA"
          test "$(cat version)" = "$VERSION"
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION" --jq '.[].ref')
          if grep -Fxq "refs/tags/$VERSION" <<< "$refs"; then
            echo 'Version tag already exists. Use a new version or rerun the failed deployment job.' >&2
            exit 1
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Hosting $VERSION" --generate-notes \
            hosting-image.tar.gz compose.hosting.yml deploy.sh version revision SHA256SUMS

  deploy:
    needs: [verify, publish]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: mac-studio
    runs-on: [self-hosted, macOS, ARM64, csweet-hosting-deploy]
    concurrency:
      group: hosting-mac-studio-live
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/hosting-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install and verify Hosting
        env:
          HOSTING_DEPLOY_DIR: ${{ vars.HOSTING_DEPLOY_DIR }}
          BUNDLE: ${{ runner.temp }}/hosting-${{ github.run_id }}-${{ github.run_attempt }}
          VERSION: ${{ inputs.version }}
        run: |
          cd "$BUNDLE"
          shasum -a 256 -c SHA256SUMS
          test "$(cat revision)" = "$GITHUB_SHA"
          test "$(cat version)" = "$VERSION"
          bash deploy.sh
          echo "Live on Mac Studio: $VERSION ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
